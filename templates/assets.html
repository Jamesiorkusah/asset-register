<!-- Reuse the shared page structure from base.html. -->
{% extends "base.html" %}

<!-- Everything inside this block is inserted into base.html's main section. -->
{% block content %}
<h1>All Assets</h1>

<p><a href="/assets/new">Add New Asset</a></p>
<!-- The table headings describe the four values shown for each asset. -->
 <form method="get" action="/assets">
    <input type="text" name="q" placeholder="Search by tag or type" value="{{q or ''}}">
    <select name="status">
        <option value="">All statuses</option>
        <option value="In Use">In Use</option>
        <option value="In store">In Store</option>
        <option value="Faulty">Faulty</option>
        <option value="Retired">Retired</option>
    </select>
    <button type ="submit">Filter</button>
    <a href="/assets">Clear</a>
 </form>
 <p>{{assets|length}} asset (s) found.</p>
<table>
    <tr>
        <th>Tag</th>
        <th>Type</th>
        <th>Model</th>
        <th>Status</th>
        <th>Actions</th>
    </tr>

    <!-- Jinja repeats this row once for every item in the assets list. -->
    {% for asset in assets %}
    <tr>
        <!-- {{ asset.field }} displays a value from the current asset. -->
        <td>{{ asset.tag }}</td>
        <td>{{ asset.type }}</td>
        <td>{{ asset.model }}</td>
        <td>{{ asset.status }}</td>
        <td>
            <a href="/assets/{{ asset.id }}/edit">Edit</a>
            <form method="post" action="/assets/{{ asset.id }}/delete"
                  onsubmit="return confirm('Delete {{ asset.tag }}? This cannot be undone.');">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
